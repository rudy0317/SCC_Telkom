<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form SCC Telkom</title>
    <!-- Telkom Red SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e60000'/%3E%3Cpath d='M8 10h16v3H8zm6 3h4v10h-4z' fill='%23ffffff'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #F4F4F5;
            --panel: #FFFFFF;
            --border: #E4E4E7;
            --border-focus: #E60000;
            --text-primary: #18181B;
            --text-secondary: #52525B;
            --text-muted: #A1A1AA;
            --telkom-red: #E60000;
            --telkom-red-hover: #CC0000;
            --accent-red-bg: #FEF2F2;
            --accent-red-fg: #991B1B;
            --accent-blue-bg: #EFF6FF;
            --accent-blue-fg: #1E40AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Kiri - Form */
        aside {
            width: 380px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            flex-shrink: 0;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.03);
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title span.telkom {
            color: var(--telkom-red);
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .badge-tag {
            font-family: monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--accent-red-bg);
            color: var(--telkom-red);
            border: 1px solid #FECACA;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-group input {
            background: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 11px 13px;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .input-group input:focus {
            border-color: var(--telkom-red);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(230, 0, 0, 0.08);
        }

        button {
            background: var(--telkom-red);
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            margin-top: 4px;
            box-shadow: 0 2px 4px rgba(230, 0, 0, 0.15);
        }

        button:hover {
            background: var(--telkom-red-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Main Kanan - Result Frame */
        main {
            flex: 1;
            position: relative;
            background: var(--bg);
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            max-width: 320px;
            line-height: 1.6;
        }

        .placeholder-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 16px auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--telkom-red);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* Responsive Layout untuk Mobile */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            aside {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            main {
                height: 600px;
            }
        }

        /* Sembunyikan sistem sebelum auth */
        body.locked aside,
        body.locked main {
            display: none !important;
        }

        /* Modal Lock Screen */
        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(244, 244, 245, 0.95);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-box {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 40px 36px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            text-align: left;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        .lock-box h3 {
            margin-bottom: 4px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .lock-box h3 span {
            color: var(--telkom-red);
        }

        .lock-box p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .lock-box input {
            width: 100%;
            background: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 11px 13px;
            font-size: 13.5px;
            font-family: monospace;
            outline: none;
            margin-bottom: 14px;
        }

        .lock-box input:focus {
            border-color: var(--telkom-red);
            box-shadow: 0 0 0 3px rgba(230, 0, 0, 0.08);
        }

        .lock-box button {
            width: 100%;
            margin-top: 0;
        }

        .error-msg {
            background: var(--accent-red-bg);
            color: var(--accent-red-fg);
            border: 1px solid #FECACA;
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 14px;
            display: none;
        }
    </style>
</head>
<body class="locked">

    <!-- Lock Screen Modal -->
    <div class="lock-overlay" id="lockOverlay">
        <div class="lock-box">
            <h3><span>TELKOM AKSES</span> AUTHENTICATION</h3>
            <p>Masukkan Access Key teknisi untuk membuka SCC Workspace.</p>
            <input type="password" id="accessKeyInput" placeholder="Access Key..." autocomplete="off">
            <button type="button" id="unlockBtn">Buka Akses</button>
            <div class="error-msg" id="errorMsg">Access Key salah. Akses ditolak.</div>
        </div>
    </div>

    <!-- Panel Kiri: Form Input -->
    <aside>
        <div class="brand-header">
            <div class="brand-title">
                <span>FORM <span class="telkom">SCC</span></span>
                <span class="badge-tag">v1.0</span>
            </div>
            <div class="brand-subtitle">Telkom Akses Field Workspace</div>
        </div>

        <form id="sccForm">
            <div class="input-group">
                <label for="ticketId">Nomor Tiket</label>
                <input type="text" id="ticketId" placeholder="Contoh: INC40660193" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="odpSearch">Cari Nama / Koordinat ODP</label>
                <input type="text" id="odpSearch" list="odpList" placeholder="Ketik nama ODP..." autocomplete="off" required>
                <datalist id="odpList"></datalist>
            </div>

            <div class="input-group">
                <label for="nd">Nomor Internet</label>
                <input type="text" id="nd" placeholder="Contoh: 162201205432" required autocomplete="off">
            </div>

            <button type="submit">Submit Check</button>
        </form>
    </aside>

    <!-- Panel Kanan: Hasil Speedtest / Frame Embed -->
    <main>
        <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <path d="M9 3v18"></path>
                </svg>
            </div>
            <p>Isi data form di sebelah kiri untuk memulai eksekusi SCC.</p>
        </div>

        <div id="frameContainer" style="display: none; width: 100%; height: 100%; position: relative;">
            <div style="position: absolute; top: 12px; right: 12px; z-index: 100; background: var(--panel); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; display: flex; gap: 8px; align-items: center;">
                <span style="font-size: 11px; color: var(--text-secondary);">Direct Link:</span>
                <a id="openTabBtn" href="#" target="_blank" style="color: var(--text-primary); font-size: 11px; font-weight: 500; text-decoration: underline;">Open SCC Window ↗</a>
            </div>
            <iframe id="sccFrame" src="" allow="geolocation" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </main>

    <script>
        const form = document.getElementById('sccForm');
        const ticketInput = document.getElementById('ticketId');
        const odpSearch = document.getElementById('odpSearch');
        const odpList = document.getElementById('odpList');
        const koordinatInput = document.getElementById('koordinat');
        const ndInput = document.getElementById('nd');
        const iframe = document.getElementById('sccFrame');
        const placeholder = document.getElementById('placeholder');
        const lockOverlay = document.getElementById('lockOverlay');
        const accessKeyInput = document.getElementById('accessKeyInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');

        window.fakeLat = 0;
        window.fakeLng = 0;
        let odpMap = new Map();

        // Password Validation Logic (Hash Target: "RUDY111" -> sha256)
        // SHA-256 for "RUDY111": 60445001b59f92e1ab5aab79c9182767ec9395c9ea1b289a61340bba637dc117
        const TARGET_HASH = "60445001b59f92e1ab5aab79c9182767ec9395c9ea1b289a61340bba637dc117";

        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyAccess(key) {
            const hash = await sha256(key);
            if (hash === TARGET_HASH) {
                localStorage.setItem('scc_auth', key);
                document.body.classList.remove('locked');
                lockOverlay.style.display = 'none';
                loadODPData();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        unlockBtn.addEventListener('click', () => {
            verifyAccess(accessKeyInput.value.trim());
        });

        accessKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyAccess(accessKeyInput.value.trim());
        });

        // Auto Check Stored Auth
        (async function checkStoredAuth() {
            const savedKey = localStorage.getItem('scc_auth');
            if (savedKey) {
                const hash = await sha256(savedKey);
                if (hash === TARGET_HASH) {
                    document.body.classList.remove('locked');
                    lockOverlay.style.display = 'none';
                    loadODPData();
                    return;
                }
            }
            document.body.classList.add('locked');
            lockOverlay.style.display = 'flex';
        })();

        // Load ODP Data only after verified
        function loadODPData() {
            if (odpMap.size > 0) return;
            fetch('odp.json')
                .then(res => res.json())
                .then(data => {
                    const fragment = document.createDocumentFragment();
                    data.forEach(item => {
                        odpMap.set(item.n, `${item.la}, ${item.lo}`);
                        const option = document.createElement('option');
                        option.value = item.n;
                        fragment.appendChild(option);
                    });
                    odpList.appendChild(fragment);
                })
        }

        // Silent Geolocation Override
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition = function(success, error, options) {
                if (window.fakeLat && window.fakeLng) {
                    success({
                        coords: {
                            latitude: window.fakeLat,
                            longitude: window.fakeLng,
                            accuracy: 3,
                            altitude: null,
                            altitudeAccuracy: null,
                            heading: null,
                            speed: null
                        },
                        timestamp: Date.now()
                    });
                } else {
                    error({ code: 1, message: "Position unavailable" });
                }
            };

            navigator.geolocation.watchPosition = function(success, error, options) {
                navigator.geolocation.getCurrentPosition(success, error, options);
                return 1;
            };
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const ticketId = ticketInput.value.trim();
            const rawOdpVal = odpSearch.value.trim();
            const nd = ndInput.value.trim();

            let rawCoords = '';
            if (odpMap.has(rawOdpVal)) {
                rawCoords = odpMap.get(rawOdpVal);
            } else {
                rawCoords = rawOdpVal;
            }

            const parts = rawCoords.split(',').map(s => s.trim());
            let lat = 0, lng = 0;
            if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                lat = parseFloat(parts[0]);
                lng = parseFloat(parts[1]);
            }

            window.fakeLat = lat;
            window.fakeLng = lng;

            const targetUrl = `https://scc.telkom.co.id/CloseTicket.Internet/Check_embededv1/?ticketId=${encodeURIComponent(ticketId)}&nd=${encodeURIComponent(nd)}`;

            // Tampilkan frame container & update iframe
            document.getElementById('frameContainer').style.display = 'block';
            placeholder.style.display = 'none';
            document.getElementById('openTabBtn').href = targetUrl;
            iframe.src = targetUrl;

            // Kirim koordinat & target URL ke Extension untuk simpan koordinat & buka popup window
            window.postMessage({
                type: 'SCC_COORDS',
                lat: lat,
                lng: lng,
                targetUrl: targetUrl
            }, '*');
        });
    </script>
</body>
</html>
